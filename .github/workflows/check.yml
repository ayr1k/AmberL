name: Build and package development probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A user-requested manual-only candidate builds packages without running tests.
      # Ordinary commits retain the existing verification steps.
      - name: Read candidate verification mode
        shell: pwsh
        run: |
          $manual = (git log -1 --format=%B) -contains '[manual-test-only]'
          "AMBERL_MANUAL_TEST_ONLY=$($manual.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if ($manual) { 'User-requested build-only candidate. Tests and application launch were NOT run; manual acceptance pending.' >> $env:GITHUB_STEP_SUMMARY }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup component add rust-docs
      - run: cargo fmt --all --check
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
      - run: cargo test --workspace --locked
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
      - run: cargo build --workspace --release --locked
      - shell: pwsh
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
        run: ./scripts/test-native-probe.ps1
      - shell: pwsh
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
        run: ./scripts/test-resource-plan.ps1
      - shell: pwsh
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
        run: ./scripts/test-install.ps1
      - shell: pwsh
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
        run: ./scripts/test-launch-boundaries.ps1
      - shell: pwsh
        run: ./scripts/package-probe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AmberL-native-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
  ui-comparison:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A user-requested manual-only candidate builds packages without running tests.
      # Ordinary commits retain the existing verification steps.
      - name: Read candidate verification mode
        shell: pwsh
        run: |
          $manual = (git log -1 --format=%B) -contains '[manual-test-only]'
          "AMBERL_MANUAL_TEST_ONLY=$($manual.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if ($manual) { 'User-requested build-only candidate. Tests and application launch were NOT run; manual acceptance pending.' >> $env:GITHUB_STEP_SUMMARY }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup component add rust-docs
      - run: cargo fmt --manifest-path experiments/slint/Cargo.toml --check
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
      - run: cargo clippy --manifest-path experiments/slint/Cargo.toml --all-targets --locked -- -D warnings
        if: env.AMBERL_MANUAL_TEST_ONLY != 'true'
        env:
          SLINT_STYLE: fluent
      - shell: pwsh
        run: ./scripts/package-ui-comparison.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AmberL-ui-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/AmberL-ui-comparison-*.zip
            artifacts/AmberL-test-*-windows-x64.exe
            artifacts/AmberL-test-*-windows-x64.exe.sha256
          if-no-files-found: error
