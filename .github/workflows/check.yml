name: Verify and package development probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup component add rust-docs
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - shell: pwsh
        run: ./scripts/test-native-probe.ps1
      - shell: pwsh
        run: ./scripts/test-resource-plan.ps1
      - shell: pwsh
        run: ./scripts/test-install.ps1
      - shell: pwsh
        run: ./scripts/test-launch-boundaries.ps1
      - shell: pwsh
        run: ./scripts/package-probe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AmberL-native-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
