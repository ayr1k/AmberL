[package]
name = "amberl-slint-probe"
version = "0.1.0-dev.1"
edition = "2024"
license = "MPL-2.0"

[dependencies]
amberl-ui-model = { path = "../../crates/amberl-ui-model" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
